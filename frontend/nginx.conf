#  ==========================================================================
#  管理端 Nginx 配置 —— IT 运维工单台账与日报自动管理系统
#  静态资源托管、/api 反向代理与 SPA history 回退
#  
#  作者：锦轩 (JinXuan) <2686389727@qq.com>
#  创建：2026-10-29　　版本：1.2.1
